apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-fips-enabled
  namespace: openshift-compliance
spec:
  title: "Hosted clusters must enable FIPS mode (STIG SRG-APP-000514 / NIST SC-13)"
  id: hcp_fips_enabled
  description: "Hosted clusters must enable FIPS mode (STIG SRG-APP-000514 / NIST SC-13). Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "One or more HostedClusters does not set .spec.fips=true. FIPS is immutable; the cluster must be recreated with fips enabled."
  severity: high
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
        resourceNamespace: clusters
  expression: |
    hcs.items.size() > 0 &&
    hcs.items.all(hc, has(hc.spec.fips) && hc.spec.fips == true)
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-etcd-secret-encryption
  namespace: openshift-compliance
spec:
  title: "Hosted cluster etcd secrets must be encrypted (NIST SC-28)"
  id: hcp_etcd_secret_encryption
  description: "Hosted cluster etcd secrets must be encrypted (NIST SC-28). Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "HostedCluster .spec.secretEncryption is not set to kms or aescbc."
  severity: high
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
        resourceNamespace: clusters
  expression: |
    hcs.items.size() > 0 &&
    hcs.items.all(hc, has(hc.spec.secretEncryption) && has(hc.spec.secretEncryption.type) &&
      (hc.spec.secretEncryption.type == 'kms' || hc.spec.secretEncryption.type == 'aescbc'))
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-audit-profile
  namespace: openshift-compliance
spec:
  title: "Hosted cluster API server audit profile must log request bodies (STIG / NIST AU-2)"
  id: hcp_audit_profile
  description: "Hosted cluster API server audit profile must log request bodies (STIG / NIST AU-2). Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "HostedCluster .spec.configuration.apiServer.audit.profile is not WriteRequestBodies or AllRequestBodies."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
        resourceNamespace: clusters
  expression: |
    hcs.items.size() > 0 &&
    hcs.items.all(hc, has(hc.spec.configuration) && has(hc.spec.configuration.apiServer) &&
      has(hc.spec.configuration.apiServer.audit) && has(hc.spec.configuration.apiServer.audit.profile) &&
      hc.spec.configuration.apiServer.audit.profile in ['WriteRequestBodies', 'AllRequestBodies'])
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-api-tls-security-profile
  namespace: openshift-compliance
spec:
  title: "Hosted cluster API server must not use Old TLS profile (NIST SC-8)"
  id: hcp_api_tls_security_profile
  description: "Hosted cluster API server must not use Old TLS profile (NIST SC-8). Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "HostedCluster sets an Old or weak Custom tlsSecurityProfile on the API server."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
        resourceNamespace: clusters
  expression: |
    hcs.items.all(hc,
      !has(hc.spec.configuration) || !has(hc.spec.configuration.apiServer) ||
      !has(hc.spec.configuration.apiServer.tlsSecurityProfile) ||
      (hc.spec.configuration.apiServer.tlsSecurityProfile.type != 'Old' &&
       (hc.spec.configuration.apiServer.tlsSecurityProfile.type != 'Custom' ||
        (has(hc.spec.configuration.apiServer.tlsSecurityProfile.custom.minTLSVersion) &&
         !(hc.spec.configuration.apiServer.tlsSecurityProfile.custom.minTLSVersion in ['VersionTLS10', 'VersionTLS11'])))))
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-oauth-token-maxage
  namespace: openshift-compliance
spec:
  title: "Hosted cluster OAuth access token max age must be 8h or less (STIG)"
  id: hcp_oauth_token_maxage
  description: "Hosted cluster OAuth access token max age must be 8h or less (STIG). Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "HostedCluster .spec.configuration.oauth.tokenConfig.accessTokenMaxAgeSeconds is unset or exceeds 28800."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
        resourceNamespace: clusters
  expression: |
    hcs.items.size() > 0 &&
    hcs.items.all(hc, has(hc.spec.configuration) && has(hc.spec.configuration.oauth) &&
      has(hc.spec.configuration.oauth.tokenConfig) &&
      has(hc.spec.configuration.oauth.tokenConfig.accessTokenMaxAgeSeconds) &&
      hc.spec.configuration.oauth.tokenConfig.accessTokenMaxAgeSeconds <= 28800)
---
