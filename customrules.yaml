    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
    - name: clustervar
      kubernetesInputSpec:
        group: compliance.openshift.io
        apiVersion: v1alpha1
        resource: variables
        resourceNamespace: openshift-compliance
        resourceName: ocp4-hypershift-cluster
    - name: prefixvar
      kubernetesInputSpec:
        group: compliance.openshift.io
        apiVersion: v1alpha1
        resource: variables
        resourceNamespace: openshift-compliance
        resourceName: ocp4-hypershift-namespace-prefix
  expression: |
    hcs.items.exists(hc, hc.metadata.name == clustervar.value && hc.metadata.namespace == prefixvar.value) &&
    hcs.items.filter(hc, hc.metadata.name == clustervar.value && hc.metadata.namespace == prefixvar.value)
      .all(hc, has(hc.spec.auditWebhook) && hc.spec.auditWebhook.name != '')
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-nodepool-config
  namespace: openshift-compliance
spec:
  title: "NodePools of the selected hosted cluster must carry node hardening configuration"
  id: hcp_nodepool_config
  description: "NodePools of the selected hosted cluster must carry node hardening configuration. PER-CLUSTER: the evaluated hosted cluster is selected by the ocp4-hypershift-cluster / ocp4-hypershift-namespace-prefix Variable CR values, fetched as rule inputs (variable-as-input pattern). Set the selector with: oc patch variable ocp4-hypershift-cluster -n openshift-compliance --type merge -p '{\"value\":\"<name>\"}'."
  failureReason: "A NodePool of the selected hosted cluster has no .spec.config; its worker nodes receive no hardening MachineConfigs."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: nps
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: nodepools
    - name: clustervar
      kubernetesInputSpec:
        group: compliance.openshift.io
        apiVersion: v1alpha1
        resource: variables
        resourceNamespace: openshift-compliance
        resourceName: ocp4-hypershift-cluster
    - name: prefixvar
      kubernetesInputSpec:
        group: compliance.openshift.io
        apiVersion: v1alpha1
        resource: variables
        resourceNamespace: openshift-compliance
        resourceName: ocp4-hypershift-namespace-prefix
  expression: |
    nps.items.filter(np, np.metadata.namespace == prefixvar.value && has(np.spec.clusterName) && np.spec.clusterName == clustervar.value)
      .all(np, has(np.spec.config) && np.spec.config.size() > 0)