apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-etcd-cert-file
  namespace: openshift-compliance
spec:
  title: "etcd server cert file configured (env-based, replaces ocp4-etcd-cert-file)"
  id: hcp_etcd_cert_file
  description: "etcd server cert file configured (env-based, replaces ocp4-etcd-cert-file). PER-CLUSTER: the evaluated hosted cluster is selected by the ocp4-hypershift-cluster / ocp4-hypershift-namespace-prefix Variable CR values, fetched as rule inputs (variable-as-input pattern). Set the selector with: oc patch variable ocp4-hypershift-cluster -n openshift-compliance --type merge -p '{\"value\":\"<name>\"}'."
  failureReason: "etcd in the selected hosted cluster's control-plane namespace does not set ETCD_CERT_FILE appropriately (env-based TLS config), or no etcd pods were found there."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: pods
      kubernetesInputSpec:
        apiVersion: v1
        resource: pods
    - name: clustervar
      kubernetesInputSpec:
        group: compliance.openshift.io
        apiVersion: v1alpha1
        resource: variables
        resourceNamespace: openshift-compliance
        resourceName: ocp4-hypershift-cluster
    - name: prefixvar
      kubernetesInputSpec:
        group: compliance.openshift.io
        apiVersion: v1alpha1
        resource: variables
        resourceNamespace: openshift-compliance
        resourceName: ocp4-hypershift-namespace-prefix
  expression: |
    pods.items.exists(p, p.metadata.namespace == prefixvar.value + '-' + clustervar.value && has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd') &&
    pods.items.filter(p, p.metadata.namespace == prefixvar.value + '-' + clustervar.value && has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd')
      .all(p, p.spec.containers.exists(c, c.name == 'etcd') &&
        p.spec.containers.filter(c, c.name == 'etcd')
          .all(c, c.env.exists(e, e.name == 'ETCD_CERT_FILE' && has(e.value) && e.value != '')))
---
