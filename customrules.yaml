  namespace: openshift-compliance
spec:
  title: "Selected hosted cluster must be created with FIPS mode enabled"
  id: hcp_fips_enabled
  description: "Selected hosted cluster must be created with FIPS mode enabled. PER-CLUSTER: the evaluated hosted cluster is selected by the ocp4-hypershift-cluster / ocp4-hypershift-namespace-prefix Variable CR values, fetched as rule inputs (variable-as-input pattern). Set the selector with: oc patch variable ocp4-hypershift-cluster -n openshift-compliance --type merge -p '{\"value\":\"<name>\"}'."
  failureReason: "The selected HostedCluster does not exist or does not set .spec.fips=true. FIPS is immutable; the cluster must be recreated with fips enabled."
