apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-etcd-cert-file
  namespace: openshift-compliance
spec:
  title: "etcd server cert file configured (env-based, replaces ocp4-etcd-cert-file)"
  id: hcp_etcd_cert_file
  description: "etcd server cert file configured (env-based, replaces ocp4-etcd-cert-file). Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "etcd container in clusters-hcp-demo does not set ETCD_CERT_FILE appropriately (env-based TLS config)."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: pods
      kubernetesInputSpec:
        apiVersion: v1
        resource: pods
        resourceNamespace: clusters-hcp-demo
  expression: |
    pods.items.exists(p, has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd') &&
    pods.items.filter(p, has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd')
      .all(p, p.spec.containers.exists(c, c.name == 'etcd') &&
        p.spec.containers.filter(c, c.name == 'etcd')
          .all(c, c.env.exists(e, e.name == 'ETCD_CERT_FILE' && has(e.value) && e.value != '')))
---
