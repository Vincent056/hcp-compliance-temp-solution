apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-nodepool-config
  namespace: openshift-compliance
spec:
  title: "Every NodePool must carry node hardening configuration"
  id: hcp_nodepool_config
  description: "Every NodePool must carry node hardening configuration. Temporary CEL workaround / gap-filler for HyperShift hosted control planes."
  failureReason: "A NodePool has no .spec.config; worker nodes receive no hardening MachineConfigs."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: nps
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: nodepools
        resourceNamespace: clusters
  expression: |
    nps.items.size() == 0 ||
    nps.items.all(np, has(np.spec.config) && np.spec.config.size() > 0)