apiVersion: compliance.openshift.io/v1alpha1
kind: TailoredProfile
metadata:
  name: hypershift-cis-hcp-demo
  namespace: openshift-compliance
spec:
  extends: ocp4-cis
  title: CIS scan of hosted control plane hcp-demo
  description: Management-cluster scan targeting HostedCluster hcp-demo
  setValues:
  - name: ocp4-hypershift-cluster
    rationale: This value is used for HyperShift version detection
    value: hcp-demo
  - name: ocp4-hypershift-namespace-prefix
    rationale: This value is used for HyperShift control plane namespace detection
    value: clusters
