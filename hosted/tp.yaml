apiVersion: compliance.openshift.io/v1alpha1
kind: TailoredProfile
metadata:
  name: hosted-stig-tailored
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
spec:
  extends: ocp4-stig
  title: "ocp4-stig for hosted clusters (CP rules disabled)"
  description: In-hosted scan with control-plane rules disabled (temp workaround for hosted CPE detection)
  disableRules:
    - name: ocp4-api-server-encryption-provider-cipher
      rationale: Control-plane rule; hosted CPE detection broken (init-container vs containers OVAL mismatch), disabled to replicate ocp4-on-hypershift-hosted gating
    - name: ocp4-audit-log-forwarding-enabled
      rationale: Control-plane rule; hosted CPE detection broken (init-container vs containers OVAL mismatch), disabled to replicate ocp4-on-hypershift-hosted gating
    - name: ocp4-cluster-version-operator-verify-integrity
      rationale: "Structural false positive in-hosted: the CVO performs no release-image signature verification on HyperShift (confirmed by OTA/HCP engineering), so every clusterversion history entry is verified=false forever. The rule's jq filter drops the newest entry, so a never-upgraded hosted cluster passes vacuously and every upgraded one FAILs permanently (history is immutable). Release-image trust is delegated to the management cluster; record as an SSP compensating control."
    - name: ocp4-oauth-login-template-set
      rationale: Control-plane rule; hosted CPE detection broken (init-container vs containers OVAL mismatch), disabled to replicate ocp4-on-hypershift-hosted gating
    - name: ocp4-oauth-provider-selection-set
      rationale: Control-plane rule; hosted CPE detection broken (init-container vs containers OVAL mismatch), disabled to replicate ocp4-on-hypershift-hosted gating
    - name: ocp4-oauth-or-oauthclient-token-maxage
      rationale: Split for HCP - the server half reads this guest's oauths/cluster, which is not reconciled from HostedCluster.spec; server half is assessed by mgmt CEL hcp-oauth-token-maxage, client half by in-hosted CEL hcp-oauthclient-token-maxage (hosted/tp-cel.yaml)
    - name: ocp4-oauth-or-oauthclient-inactivity-timeout
      rationale: Split for HCP - the server half reads this guest's oauths/cluster, which is not reconciled from HostedCluster.spec; server half is assessed by mgmt CEL hcp-oauth-inactivity-timeout, client half by in-hosted CEL hcp-oauthclient-inactivity-timeout (hosted/tp-cel.yaml)

