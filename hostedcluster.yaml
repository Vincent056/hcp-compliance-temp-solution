apiVersion: v1
kind: Namespace
metadata:
  name: clusters
---
# NOTE: create the pull secret separately before applying this manifest:
#   oc create secret generic hcp-demo-pull-secret -n clusters \
#     --from-file=.dockerconfigjson=<your-pull-secret.json> --type=kubernetes.io/dockerconfigjson
---
apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: hcp-demo
  namespace: clusters
spec:
  release:
    # Substitute your release image, e.g. the management cluster's own:
    #   oc get clusterversion version -o jsonpath='{.status.desired.image}'
    image: <release-image>
  pullSecret:
    name: hcp-demo-pull-secret
  infraID: hcp-demo
  controllerAvailabilityPolicy: SingleReplica
  olmCatalogPlacement: guest
  infrastructureAvailabilityPolicy: SingleReplica
  platform:
    type: None
  dns:
    # Substitute your base domain (for CI clusters: the cluster's own domain)
    baseDomain: <base-domain>
  etcd:
    managementType: Managed
    managed:
      storage:
        type: PersistentVolume
        persistentVolume:
          size: 8Gi
  networking:
    clusterNetwork:
    - cidr: 10.132.0.0/14
    serviceNetwork:
    - cidr: 172.31.0.0/16
    networkType: OVNKubernetes
  services:
  - service: APIServer
    servicePublishingStrategy:
      type: LoadBalancer
  - service: OAuthServer
    servicePublishingStrategy:
      type: Route
  - service: Konnectivity
    servicePublishingStrategy:
      type: Route
  - service: Ignition
    servicePublishingStrategy:
      type: Route
