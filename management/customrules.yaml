  name: hcp-api-tls-security-profile
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
id: xccdf_org.ssgproject.content_rule_hcp_api_tls_security_profile
title: "Selected hosted cluster API server must not use Old TLS profile (NIST SC-8)"
description: "Selected hosted cluster API server must not use Old TLS profile (NIST SC-8). PER-CLUSTER via TailoredProfile setValues, NATIVE delivery: the operator does not support setValues in CEL CustomRules (rejected at validation), but directly-created Rule CRs have no admission validation and the scanner declares and binds each TailoredProfile's setValues at evaluation. This rule's expression references the dash-free Variable CRs hypershiftcluster / hypershiftprefix directly, so every TailoredProfile that enables it selects its own target cluster - multiple TailoredProfiles can scan different hosted clusters CONCURRENTLY with this single rule. Both setValues entries are REQUIRED in each enabling TailoredProfile (a missing entry surfaces as a scan-time ERROR, not a FAIL). Rule CRs get no admission validation - validate expression changes with celctl before applying. The Rule and Variable CRs carry ownerReferences to the ocp4 ProfileBundle (required by the TailoredProfile controller; set by management/deploy.sh) - re-apply after any ProfileBundle recreation. No bundle Variable CR is read or modified."
failureReason: "The selected HostedCluster does not exist, or sets an Old or weak Custom tlsSecurityProfile on the API server. Also check hcp-selector-valid: it FAILs when the selected HostedCluster does not exist; a scan-time ERROR on this rule means a setValues entry is missing in the enabling TailoredProfile."
severity: medium
checkType: Platform
scannerType: CEL
inputs:
  - name: hcs
    kubernetesInputSpec:
      group: hypershift.openshift.io
      apiVersion: v1beta1
      resource: hostedclusters
expression: |
  hcs.items.exists(hc, hc.metadata.name == hypershiftcluster && hc.metadata.namespace == hypershiftprefix) &&
  hcs.items.filter(hc, hc.metadata.name == hypershiftcluster && hc.metadata.namespace == hypershiftprefix)
    .all(hc, !has(hc.spec.configuration) || !has(hc.spec.configuration.apiServer) ||
      !has(hc.spec.configuration.apiServer.tlsSecurityProfile) ||
      (hc.spec.configuration.apiServer.tlsSecurityProfile.type != 'Old' &&
       (hc.spec.configuration.apiServer.tlsSecurityProfile.type != 'Custom' ||
        (has(hc.spec.configuration.apiServer.tlsSecurityProfile.custom.minTLSVersion) &&
         !(hc.spec.configuration.apiServer.tlsSecurityProfile.custom.minTLSVersion in ['VersionTLS10', 'VersionTLS11'])))))
---
