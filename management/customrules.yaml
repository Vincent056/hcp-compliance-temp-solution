# Management-side CEL rules: 2 dash-free selector Variables + 15 rules shipped as
# directly-created Rule CRs (kind: Rule, NOT CustomRule) for NATIVE per-TP
# setValues delivery - see README section 7.2. Apply with management/deploy.sh
# (it also sets the required ownerReferences to the ocp4 ProfileBundle).
apiVersion: compliance.openshift.io/v1alpha1
kind: Variable
metadata:
  name: hypershiftcluster
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
id: xccdf_org.ssgproject.content_value_hypershiftcluster
title: "Selector: name of the hosted cluster to assess"
description: "Dash-free so CEL expressions can reference it as a legal identifier. Set per TailoredProfile via setValues; the CR value itself is never used for selection and never patched."
type: string
value: unset
---
apiVersion: compliance.openshift.io/v1alpha1
kind: Variable
metadata:
  name: hypershiftprefix
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
id: xccdf_org.ssgproject.content_value_hypershiftprefix
title: "Selector: HostedCluster namespace / control-plane namespace prefix"
description: "Dash-free so CEL expressions can reference it as a legal identifier. Set per TailoredProfile via setValues; the CR value itself is never used for selection and never patched."
type: string
value: clusters
---
apiVersion: compliance.openshift.io/v1alpha1
kind: Rule
metadata:
  name: hcp-etcd-cert-file
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
id: xccdf_org.ssgproject.content_rule_hcp_etcd_cert_file
title: "etcd server cert file configured (env-based, replaces ocp4-etcd-cert-file)"
description: "etcd server cert file configured (env-based, replaces ocp4-etcd-cert-file). PER-CLUSTER via TailoredProfile setValues, NATIVE delivery: the operator does not support setValues in CEL CustomRules (rejected at validation), but directly-created Rule CRs have no admission validation and the scanner declares and binds each TailoredProfile's setValues at evaluation. This rule's expression references the dash-free Variable CRs hypershiftcluster / hypershiftprefix directly, so every TailoredProfile that enables it selects its own target cluster - multiple TailoredProfiles can scan different hosted clusters CONCURRENTLY with this single rule. Both setValues entries are REQUIRED in each enabling TailoredProfile (a missing entry surfaces as a scan-time ERROR, not a FAIL). Rule CRs get no admission validation - validate expression changes with celctl before applying. The Rule and Variable CRs carry ownerReferences to the ocp4 ProfileBundle (required by the TailoredProfile controller; set by management/deploy.sh) - re-apply after any ProfileBundle recreation. No bundle Variable CR is read or modified."
failureReason: "etcd in the selected hosted cluster's control-plane namespace does not set ETCD_CERT_FILE appropriately (env-based TLS config), or no etcd pods were found there. Also check hcp-selector-valid: it FAILs when the selected HostedCluster does not exist; a scan-time ERROR on this rule means a setValues entry is missing in the enabling TailoredProfile."
severity: medium
checkType: Platform
scannerType: CEL
inputs:
  - name: pods
    kubernetesInputSpec:
      apiVersion: v1
      resource: pods
expression: |
  pods.items.exists(p, p.metadata.namespace == hypershiftprefix + '-' + hypershiftcluster &&
    has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd') &&
  pods.items.filter(p, p.metadata.namespace == hypershiftprefix + '-' + hypershiftcluster &&
    has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd')
    .all(p, p.spec.containers.exists(c, c.name == 'etcd') &&
      p.spec.containers.filter(c, c.name == 'etcd')
        .all(c, c.env.exists(e, e.name == 'ETCD_CERT_FILE' && has(e.value) && e.value != '')))
---
