# FLEET-WIDE CustomRules: one scan gating EVERY HostedCluster on the management
# cluster (any violating cluster -> FAIL). Selector-free, so these are plain
# CustomRules with full admission validation. CP namespaces are derived from the
# HostedCluster objects themselves (no prefix baked in); prefix-scoped variants
# would follow the customrules-fleet-<prefix>.yaml naming convention.
# Complement: per-cluster attribution via management/customrules.yaml (README 7.2).
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-fleet-etcd-cert-file
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
spec:
  title: "Fleet gate: ETCD_CERT_FILE configured on every hosted cluster etcd"
  id: hcp_fleet_etcd_cert_file
  description: "Fleet gate: ETCD_CERT_FILE configured on every hosted cluster etcd. FLEET-WIDE gate: evaluates EVERY HostedCluster on this management cluster in one scan - a single result that FAILs if ANY hosted cluster violates, so newly onboarded violating clusters trip it automatically. No selector needed, so this ships as a CustomRule (full admission validation). Control-plane namespaces are derived per HostedCluster (metadata.namespace + '-' + metadata.name) - no namespace prefix is baked in; prefix-scoped variants, if ever needed, follow the customrules-fleet-<prefix>.yaml file naming convention. For per-cluster attribution use the per-cluster Rule set (management/customrules.yaml, README 7.2)."
  failureReason: "etcd in at least one hosted cluster's control-plane namespace does not set ETCD_CERT_FILE appropriately."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
    - name: pods
      kubernetesInputSpec:
        apiVersion: v1
        resource: pods
  expression: |
    hcs.items.all(hc,
      pods.items.filter(p, p.metadata.namespace == hc.metadata.namespace + '-' + hc.metadata.name &&
        has(p.metadata.labels) && 'app' in p.metadata.labels && p.metadata.labels['app'] == 'etcd')
        .all(p, p.spec.containers.exists(c, c.name == 'etcd') &&
          p.spec.containers.filter(c, c.name == 'etcd')
            .all(c, c.env.exists(e, e.name == 'ETCD_CERT_FILE' && has(e.value) && e.value != ''))))
---
