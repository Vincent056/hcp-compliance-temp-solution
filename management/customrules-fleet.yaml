  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
spec:
  title: "Fleet gate: Every hosted cluster OAuth token max age must be 8h or less (STIG; server half)"
  id: hcp_fleet_oauth_token_maxage
  description: "Fleet gate: Every hosted cluster OAuth token max age must be 8h or less (STIG; server half). FLEET-WIDE gate: evaluates EVERY HostedCluster on this management cluster in one scan - a single result that FAILs if ANY hosted cluster violates, so newly onboarded violating clusters trip it automatically. No selector needed, so this ships as a CustomRule (full admission validation). Control-plane namespaces are derived per HostedCluster (metadata.namespace + '-' + metadata.name) - no namespace prefix is baked in; prefix-scoped variants, if ever needed, follow the customrules-fleet-<prefix>.yaml file naming convention. For per-cluster attribution use the per-cluster Rule set (management/customrules.yaml, README 7.2)."
  failureReason: "At least one HostedCluster does not set tokenConfig.accessTokenMaxAgeSeconds <= 28800. Not a finding for clusters whose client half (hcp-oauthclient-token-maxage in-hosted) PASSes."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
  expression: |
    hcs.items.all(hc, has(hc.spec.configuration) && has(hc.spec.configuration.oauth) &&
      has(hc.spec.configuration.oauth.tokenConfig) &&
      has(hc.spec.configuration.oauth.tokenConfig.accessTokenMaxAgeSeconds) &&
      hc.spec.configuration.oauth.tokenConfig.accessTokenMaxAgeSeconds <= 28800)
