metadata:
  name: hcp-fleet-nodepool-config
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
spec:
  title: "Fleet gate: every NodePool carries node hardening configuration"
  id: hcp_fleet_nodepool_config
  description: "Fleet gate: every NodePool carries node hardening configuration. FLEET-WIDE gate: evaluates EVERY HostedCluster on this management cluster in one scan - a single result that FAILs if ANY hosted cluster violates, so newly onboarded violating clusters trip it automatically. No selector needed, so this ships as a CustomRule (full admission validation). Control-plane namespaces are derived per HostedCluster (metadata.namespace + '-' + metadata.name) - no namespace prefix is baked in; prefix-scoped variants, if ever needed, follow the customrules-fleet-<prefix>.yaml file naming convention. For per-cluster attribution use the per-cluster Rule set (management/customrules.yaml, README 7.2)."
  failureReason: "At least one NodePool has no .spec.config; its worker nodes receive no hardening MachineConfigs."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: nps
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: nodepools
  expression: |
    nps.items.all(np, has(np.spec.config) && np.spec.config.size() > 0)
