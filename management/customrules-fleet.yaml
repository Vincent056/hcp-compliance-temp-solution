  id: hcp_fleet_audit_profile
  description: "Fleet gate: Every hosted cluster API server must log request bodies (STIG / NIST AU-2). FLEET-WIDE gate: evaluates EVERY HostedCluster on this management cluster in one scan - a single result that FAILs if ANY hosted cluster violates, so newly onboarded violating clusters trip it automatically. No selector needed, so this ships as a CustomRule (full admission validation). Control-plane namespaces are derived per HostedCluster (metadata.namespace + '-' + metadata.name) - no namespace prefix is baked in; prefix-scoped variants, if ever needed, follow the customrules-fleet-<prefix>.yaml file naming convention. For per-cluster attribution use the per-cluster Rule set (management/customrules.yaml, README 7.2)."
  failureReason: "At least one HostedCluster does not set an audit profile logging request bodies."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
  expression: |
    hcs.items.all(hc, has(hc.spec.configuration) && has(hc.spec.configuration.apiServer) &&
      has(hc.spec.configuration.apiServer.audit) && has(hc.spec.configuration.apiServer.audit.profile) &&
      hc.spec.configuration.apiServer.audit.profile in ['WriteRequestBodies', 'AllRequestBodies'])
---
apiVersion: compliance.openshift.io/v1alpha1
kind: CustomRule
metadata:
  name: hcp-fleet-api-tls-security-profile
  namespace: openshift-compliance
  labels:
    app.kubernetes.io/part-of: hcp-temp-compliance
spec:
  title: "Fleet gate: No hosted cluster API server may use the Old TLS profile (NIST SC-8)"
  id: hcp_fleet_api_tls_security_profile
  description: "Fleet gate: No hosted cluster API server may use the Old TLS profile (NIST SC-8). FLEET-WIDE gate: evaluates EVERY HostedCluster on this management cluster in one scan - a single result that FAILs if ANY hosted cluster violates, so newly onboarded violating clusters trip it automatically. No selector needed, so this ships as a CustomRule (full admission validation). Control-plane namespaces are derived per HostedCluster (metadata.namespace + '-' + metadata.name) - no namespace prefix is baked in; prefix-scoped variants, if ever needed, follow the customrules-fleet-<prefix>.yaml file naming convention. For per-cluster attribution use the per-cluster Rule set (management/customrules.yaml, README 7.2)."
  failureReason: "At least one HostedCluster sets an Old or weak Custom tlsSecurityProfile."
  severity: medium
  checkType: Platform
  scannerType: CEL
  inputs:
    - name: hcs
      kubernetesInputSpec:
        group: hypershift.openshift.io
        apiVersion: v1beta1
        resource: hostedclusters
  expression: |
    hcs.items.all(hc, !has(hc.spec.configuration) || !has(hc.spec.configuration.apiServer) ||
      !has(hc.spec.configuration.apiServer.tlsSecurityProfile) ||
      (hc.spec.configuration.apiServer.tlsSecurityProfile.type != 'Old' &&
       (hc.spec.configuration.apiServer.tlsSecurityProfile.type != 'Custom' ||
        (has(hc.spec.configuration.apiServer.tlsSecurityProfile.custom.minTLSVersion) &&
         !(hc.spec.configuration.apiServer.tlsSecurityProfile.custom.minTLSVersion in ['VersionTLS10', 'VersionTLS11'])))))
---
